# Run `pre-commit install` once after cloning; mise does it on `mise install`.
# Vendored Gateway API bundles must stay byte-identical to the upstream asset, and the chart
# templates are not plain YAML.
exclude: ^charts/gateway-api-crds/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key
      - id: mixed-line-ending

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  # Tools are pinned in mise.toml and must be on PATH when the hooks run.
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.106.0
    hooks:
      - id: terraform_fmt
      - id: terraform_docs
      - id: terraform_tflint
